name: app_diagnostics
description: >-
  The half of a bug report that produces it: the recording session, the log
  record and its file mirror, the merge across isolates, the review summary, and
  the probes that observe taps, routes, requests, errors and lifecycle.
version: 0.3.1
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The redactor. Declared as a git dependency at the same ref the applications
  # pin, rather than `path: ../app_report_client`: an application that named one
  # by git and got the other by path would hand pub two sources for one package,
  # which is a resolution error rather than a warning. `pubspec_overrides.yaml`
  # points this at the sibling for this repo's own tests.
  app_report_client:
    git:
      url: https://github.com/DoYouHost/app-shared.git
      ref: v0.2.0
      path: packages/app_report_client
  # Wall-clock reads go through the ambient clock so a test can move time.
  clock: ^1.1.2
  # The make, model and API level in the session header. Whether a background
  # task survives is the OEM battery manager's decision, so "notifications never
  # arrive" is answered by the make of the phone more often than by the code.
  # A range, like `package_info_plus` below: only `androidInfo` is read here,
  # and 13 raised platform minimums rather than touching it.
  device_info_plus: '>=12.4.0 <14.0.0'
  # HttpProbe is a Dio interceptor.
  dio: ^5.7.0
  # NavigationProbe observes a GoRouter. A range rather than a caret: the probe
  # reads `GoRouterDelegate` and `GoRouterState.uri`, which 17 left alone, so
  # pinning a major here would decide the router version for every application
  # that consumes this package. The bound stops below 18, which moved onto the
  # `material_ui`/`cupertino_ui` packages — those annotate with
  # `@awaitNotRequired`, which the `meta` bundled with Flutter 3.44 does not
  # have, so 18 fails to compile on the SDK both applications build with.
  go_router: '>=16.0.0 <18.0.0'
  # `version+buildNumber` for the header. A range rather than a caret: the two
  # applications are a major apart and both spellings of the plugin work here.
  package_info_plus: '>=8.0.0 <11.0.0'
  # Session files live in the application support directory.
  path_provider: ^2.1.5
  # The running session's id, which both isolates read.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
