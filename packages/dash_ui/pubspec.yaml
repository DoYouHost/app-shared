name: dash_ui
description: >-
  The Dash design system: colour tokens resolved per brightness and brand, the
  type scale, the screen chrome, the Material theme built from them, and the
  contrast audit a brand has to pass.
version: 0.5.2
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Pinned by the Flutter SDK; HCT tones for DashBrand.fromSchemes.
  material_color_utilities: any
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The OFL texts of the two families the type scale names. The faces themselves
  # stay in the application's pubspec; see `registerDashFontLicenses`.
  assets:
    - assets/licenses/OFL-Manrope.txt
    - assets/licenses/OFL-JetBrainsMono.txt
